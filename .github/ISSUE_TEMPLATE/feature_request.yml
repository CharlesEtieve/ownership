name: 💡 Feature request
description: Suggest an idea for OwnerShip.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Who would benefit, and in which situation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you have in mind?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: OwnerShip principles
      description: OwnerShip stays playful and positive. Does the idea fit?
      options:
        - label: It is not punitive (no timers, rankings or shaming).
        - label: It needs no server and no telemetry.
        - label: It works with any model provider.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
