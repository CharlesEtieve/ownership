  <text x="44" y="186" class="t" font-size="14" font-weight="600">1. Why retry only on 429, 502, 503 and 504, and not on every 5xx?</text>
  <text x="44" y="204" class="t muted" font-size="12">🧭 Design · src/http/client.ts</text>
  <text x="44" y="236" class="t" font-size="14" font-weight="600">2. What happens if Retry-After is a date instead of a number of seconds?</text>
  <text x="44" y="254" class="t muted" font-size="12">🪨 Edge cases · src/http/client.ts</text>
  <text x="44" y="286" class="t" font-size="14" font-weight="600">3. What is the worst-case wait for callers of get(), and is it acceptable?</text>
  <text x="44" y="304" class="t muted" font-size="12">🌊 Impact · src/http/client.ts</text>
