# OwnerShip with a model you host yourself, through any OpenAI-compatible server
# (Ollama, vLLM, LM Studio, LiteLLM...). The diff never leaves your infrastructure.
name: OwnerShip (local model)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ownership-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ownership:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.action == 'created' &&
        startsWith(github.event.comment.body, '/ownership')) ||
      (github.event.issue.pull_request && github.event.action == 'edited' &&
        github.event.comment.user.type == 'Bot' &&
        github.event.sender.login == github.event.issue.user.login &&
        contains(github.event.comment.body, '- [x] ✅'))
    # A self-hosted runner that can reach your model server.
    runs-on: self-hosted
    steps:
      - uses: CharlesEtieve/ownership@v1
        with:
          provider: openai-compatible
          base-url: http://ollama.internal:11434/v1
          model: qwen2.5-coder:14b
          # api-key is optional; set it if your server or gateway requires one.
          # api-key: ${{ secrets.LLM_GATEWAY_KEY }}
