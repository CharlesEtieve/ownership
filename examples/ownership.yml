# Copy this file to .github/workflows/ownership.yml in your repository.
name: OwnerShip

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

# Minimal permissions: read the PR, write the quiz comment and the badge labels.
permissions:
  contents: read
  pull-requests: write
  issues: write
  # statuses: write   # only needed with fail-on-unanswered: true

# One run at a time per PR, so answers and pushes are processed in order.
concurrency:
  group: ownership-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ownership:
    # Start the action only for OwnerShip answers: a "/ownership" comment, or the PR author
    # ticking "Done" in the quiz comment. Other comments and clicks are skipped for free.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && github.event.action == 'created' &&
        startsWith(github.event.comment.body, '/ownership')) ||
      (github.event.issue.pull_request && github.event.action == 'edited' &&
        github.event.comment.user.type == 'Bot' &&
        github.event.sender.login == github.event.issue.user.login &&
        contains(github.event.comment.body, '- [x] ✅'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: CharlesEtieve/ownership@v1
        with:
          provider: anthropic
          model: claude-opus-5-5
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Everything below is optional.
          format: multiple-choice # or "open" to answer in your own words
          questions: 3
          language: en
          min-changed-lines: 10
          max-diff-chars: 40000
          exclude-paths: |
            migrations/**
            **/*.generated.ts
          fail-on-unanswered: false
